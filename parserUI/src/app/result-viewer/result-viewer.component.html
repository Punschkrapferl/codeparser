<div class="result-viewer" *ngIf="analysis?.trim(); else emptyState">
  <div class="toolbar">
    <h3 class="title">{{ title }}</h3>

    <div class="toolbar-actions">
      <div class="search-field">
        <input id="analysisSearch" class="search-input" type="search" [(ngModel)]="searchTerm"
          placeholder="Search in analysis" autocomplete="off" />

        <button *ngIf="searchTerm" type="button" class="icon-button clear-button" (click)="searchTerm = ''"
          aria-label="Clear search">
          ✕
        </button>
      </div>

      <button type="button" class="icon-button download-button" (click)="downloadTxt()" [disabled]="!analysis"
        aria-label="Download analysis as text file">
        ⬇
      </button>
    </div>
  </div>

  <!-- WHEN there is a search term: use highlight pipe -->
  <pre *ngIf="searchTerm; else plainAnalysis" class="analysis-pre" [innerHTML]="analysis | highlight: searchTerm"></pre>

  <!-- WHEN searchTerm is empty: show raw text, no highlight at all -->
  <ng-template #plainAnalysis>
    <pre class="analysis-pre">
{{ analysis }}
    </pre>
  </ng-template>
</div>

<ng-template #emptyState>
  <div class="result-empty">
    <p class="empty-title">{{ title }}</p>
    <p class="empty-subtitle">
      No analysis available yet. Run an analysis to see results here.
    </p>
  </div>
</ng-template>
