services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: codeparser-backend
    ports:
      - "8000:8000"
    volumes:
      - ./repos:/app/repos

  frontend:
    build:
      context: ./parserUI
      dockerfile: Dockerfile
    container_name: codeparser-frontend
    ports:
      - "4200:80"
    depends_on:
      - backend
