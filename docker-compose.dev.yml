services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: codeparser_backend
    ports:
      - "8000:8000"
    volumes:
      - ./repos:/app/repos
    environment:
      OLLAMA_HOST: http://host.docker.internal:11434
      MODEL_NAME: mistral:latest

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: codeparser_backend
    ports:
      - "4200:80"
    depends_on:
      - backend
